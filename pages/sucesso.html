<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido recebido | Vasconcelos</title>
    <link rel="stylesheet" href="../assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="../index.html#inicio">
        <img class="logo-image" src="../assets/img/vasconcelos-logo.png" alt="">
        <span>KV Store</span>
      </a>
      <nav class="main-nav product-nav">
        <a href="../index.html">Loja</a>
        <a href="contato.html">Contato</a>
      </nav>
    </header>
    <main class="static-page">
      <section>
        <p class="eyebrow">Pedido recebido</p>
        <h1>Obrigada pela compra.</h1>
        <p id="successOrderText">Seu pedido foi criado com sucesso e o WhatsApp foi aberto com a mensagem pronta para envio.</p>
        <a class="btn btn-primary" href="../index.html">Voltar para a loja</a>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("pedido");
      if (id) document.querySelector("#successOrderText").textContent = `Pedido ${id} criado com sucesso. Em breve entraremos em contato pelo WhatsApp informado.`;
    </script>
  </body>
</html>
